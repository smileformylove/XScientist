[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xscientist"
dynamic = ["version"]
description = "Local-first research with auditable web and video evidence, Git-like provenance, reproducibility, and reversible scientific history."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "third_party/licenses/*.txt",
]
authors = [
  { name = "AI Scientist Contributors" },
]
keywords = [
  "ai-scientist",
  "autonomous-research",
  "research-agents",
  "scientific-discovery",
  "reproducible-research",
  "open-science",
  "research-provenance",
  "web-search",
  "video-evidence",
  "multimodal-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.26.0",
  "PyYAML>=6.0.3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Recommended end-to-end research runtime without committing users to every
# model provider or the largest specialist stacks. Pair this with exactly one
# provider extra, for example: xscientist[research,openai].
research = [
  "backoff>=2.2.1",
  "black>=26.10.1",
  "matplotlib>=3.10.9",
  "pillow>=12.3.0",
  "pandas>=2.3.3",
  "pypdf>=6.21.4",
  "pymupdf>=1.28.2",
  "seaborn>=0.13.2",
  "numpy>=2.2.6",
  "psutil>=7.2.2",
  "requests>=2.34.2",
  "scikit-learn>=1.7.2",
  "tiktoken>=0.14.0",
  "tqdm>=4.70.1",
  "rich>=15.0.0",
  "humanize>=4.16.0",
  "dataclasses-json>=0.6.7",
  "genson>=1.4.0",
  "shutup>=0.3.0",
  "python-igraph>=1.0.0",
  "coolname>=5.0.0",
  "omegaconf>=2.4.0",
  "huggingface-hub>=2.3.0",
]

# Provider clients. OpenAI-compatible services intentionally share one client
# extra; credentials and provider routing remain separate at runtime.
openai = [
  "openai>=3.41.0",
  "backoff>=2.2.1",
  "tiktoken>=0.14.0",
]
anthropic = [
  "anthropic>=2.3.0",
  "backoff>=2.2.1",
  "tiktoken>=0.14.0",
]
zhipu = [
  "zhipuai>=2.1.5.20250825",
  "openai>=3.41.0",
  "backoff>=2.2.1",
  "tiktoken>=0.14.0",
]
openai-compatible = [
  "openai>=3.41.0",
  "backoff>=2.2.1",
  "requests>=2.34.2",
  "tiktoken>=0.14.0",
]
bedrock = [
  "anthropic[bedrock]>=2.3.0",
  "backoff>=2.2.1",
  "tiktoken>=0.14.0",
]
vertex = [
  "anthropic[vertex]>=2.3.0",
  "backoff>=2.2.1",
  "tiktoken>=0.14.0",
]

# Specialist capabilities can be added only when a study needs them.
plot = [
  "matplotlib>=3.10.9",
  "pillow>=12.3.0",
  "pandas>=2.3.3",
  "seaborn>=0.13.2",
  "numpy>=2.2.6",
  "python-igraph>=1.0.0",
]
pdf = [
  "pypdf>=6.21.4",
  "pymupdf>=1.28.2",
]
pdf-layout = [
  "pymupdf>=1.28.2",
  "pymupdf4llm>=2.0",
]
ml = [
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "scikit-learn>=1.7.2",
  "transformers>=5.20.2",
  "datasets>=5.1.0",
  "huggingface-hub>=2.3.0",
]

# Backwards-compatible all-in-one profile. Keep this list explicit so existing
# xscientist[full] installations resolve exactly the same direct dependencies.
full = [
  "anthropic>=2.3.0",
  "backoff>=2.2.1",
  "black>=26.10.1",
  "openai>=3.41.0",
  "zhipuai>=2.1.5.20250825",
  "matplotlib>=3.10.9",
  "pillow>=12.3.0",
  "pandas>=2.3.3",
  "pypdf>=6.21.4",
  "pymupdf>=1.28.2",
  "pymupdf4llm>=2.0",
  "seaborn>=0.13.2",
  "numpy>=2.2.6",
  "psutil>=7.2.2",
  "requests>=2.34.2",
  "scikit-learn>=1.7.2",
  "transformers>=5.20.2",
  "datasets>=5.1.0",
  "tiktoken>=0.14.0",
  "tqdm>=4.70.1",
  "rich>=15.0.0",
  "humanize>=4.16.0",
  "dataclasses-json>=0.6.7",
  "genson>=1.4.0",
  "shutup>=0.3.0",
  "python-igraph>=1.0.0",
  "coolname>=5.0.0",
  "omegaconf>=2.4.0",
  "boto3>=1.43.121",
  "huggingface-hub>=2.3.0",
]
service = [
  "fastapi>=0.162.0",
  "pydantic>=2.14.1",
  "uvicorn[standard]>=0.54.0",
]
trust = [
  "cryptography>=50.0.2",
]
dev = [
  "black>=26.10.1",
  "build>=1.6.1",
  "coverage[toml]>=7.16.2",
  "httpx>=0.28.1",
  "pytest>=9.2.0",
  "twine>=7.0.0",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
]

[project.urls]
Homepage = "https://github.com/smileformylove/XScientist"
Repository = "https://github.com/smileformylove/XScientist"
Issues = "https://github.com/smileformylove/XScientist/issues"
Changelog = "https://github.com/smileformylove/XScientist/blob/main/CHANGELOG.md"
Documentation = "https://github.com/smileformylove/XScientist/tree/main/docs"

[project.scripts]
xscientist = "xscientist.cli:main"
xscientist-api = "xscientist.service:main"
xscientist-project = "xscientist.entrypoints:project_main"
xscientist-batch = "xscientist.entrypoints:batch_main"
xscientist-daemon = "xscientist.entrypoints:daemon_main"
xscientist-ara = "xscientist.entrypoints:ara_main"
xscientist-manager = "xscientist.entrypoints:manager_main"
xscientist-auth = "xscientist.entrypoints:auth_main"
xscientist-feedback = "xscientist.entrypoints:feedback_main"
xscientist-validate = "xscientist.entrypoints:validate_main"
xscientist-bfts = "xscientist.entrypoints:bfts_main"
xscientist-zhipu = "xscientist.entrypoints:zhipu_main"
xscientist-preflight = "xscientist.entrypoints:preflight_main"
xscientist-research = "xscientist.entrypoints:research_main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "auth_cli",
  "continuous_paper_generator",
  "continuous_research_daemon",
  "feedback_cli",
  "launch_scientist_bfts",
  "launch_scientist_zhipu",
  "preflight_check",
  "research_manager",
  "run_ara_fork",
  "run_project",
  "validate_repo",
]

[tool.setuptools.package-dir]
"" = "compat"
ai_scientist = "ai_scientist"
xscientist = "xscientist"

[tool.setuptools.packages.find]
where = ["compat", "."]
include = ["ai_scientist*", "xscientist*"]

[tool.setuptools.package-data]
ai_scientist = [
  "blank_icbinb_latex/*",
  "blank_icml_latex/*",
  "fewshot_examples/*.json",
  "fewshot_examples/*.txt",
  "ideas/*.json",
  "ideas/*.md",
  "protocol/SPEC.md",
  "protocol/conformance/*",
  "protocol/schemas/*.json",
  "resources/configs/*.yaml",
  "treesearch/utils/viz_templates/*.html",
  "treesearch/utils/viz_templates/*.js",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
ai_scientist = ["fewshot_examples/*.pdf"]

[tool.setuptools.dynamic]
version = { attr = "xscientist._version.__version__" }

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"
extend-exclude = '''
(
  /(
      \.git
    | \.venv
    | \.ci-output
    | _outputs
    | final_papers
    | experiments
  )/
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Keep source-checkout test runs deterministic.  Without an explicit project
# path, the standalone ``pytest`` console script can omit the repository root
# from ``sys.path`` (and an unrelated site-packages ``tests`` namespace can
# win import resolution), making collection fail before any test runs.
pythonpath = ["."]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ai_scientist", "xscientist", "compat", "scripts", "tools"]
omit = [
  "*/__pycache__/*",
  "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 45
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = ".ci-output/coverage.xml"

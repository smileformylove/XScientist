[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xscientist"
dynamic = ["version"]
description = "Autonomous research with Git-like, inspectable, reproducible, and reversible evidence histories."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "third_party/licenses/*.txt",
]
authors = [
  { name = "AI Scientist Contributors" },
]
keywords = [
  "ai-scientist",
  "autonomous-research",
  "research-agents",
  "scientific-discovery",
  "reproducible-research",
  "open-science",
  "research-provenance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Recommended end-to-end research runtime without committing users to every
# model provider or the largest specialist stacks. Pair this with exactly one
# provider extra, for example: xscientist[research,openai].
research = [
  "backoff>=2.0",
  "black>=24.0",
  "matplotlib>=3.8",
  "pillow>=10",
  "pandas>=2",
  "pypdf>=4",
  "pymupdf>=1.24",
  "seaborn>=0.13",
  "numpy>=1.26",
  "psutil>=5.9",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "tiktoken>=0.7",
  "tqdm>=4.66",
  "rich>=13",
  "humanize>=4",
  "dataclasses-json>=0.6",
  "genson>=1.2",
  "shutup>=0.2",
  "python-igraph>=0.11",
  "coolname>=2",
  "omegaconf>=2.3",
  "huggingface-hub>=0.23",
]

# Provider clients. OpenAI-compatible services intentionally share one client
# extra; credentials and provider routing remain separate at runtime.
openai = [
  "openai>=1.40",
  "backoff>=2.0",
  "tiktoken>=0.7",
]
anthropic = [
  "anthropic>=0.25",
  "backoff>=2.0",
  "tiktoken>=0.7",
]
zhipu = [
  "zhipuai>=2.0",
  "openai>=1.40",
  "backoff>=2.0",
  "tiktoken>=0.7",
]
openai-compatible = [
  "openai>=1.40",
  "backoff>=2.0",
  "requests>=2.31",
  "tiktoken>=0.7",
]
bedrock = [
  "anthropic[bedrock]>=0.25",
  "backoff>=2.0",
  "tiktoken>=0.7",
]
vertex = [
  "anthropic[vertex]>=0.25",
  "backoff>=2.0",
  "tiktoken>=0.7",
]

# Specialist capabilities can be added only when a study needs them.
plot = [
  "matplotlib>=3.8",
  "pillow>=10",
  "pandas>=2",
  "seaborn>=0.13",
  "numpy>=1.26",
  "python-igraph>=0.11",
]
pdf = [
  "pypdf>=4",
  "pymupdf>=1.24",
]
pdf-layout = [
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.20",
]
ml = [
  "numpy>=1.26",
  "pandas>=2",
  "scikit-learn>=1.4",
  "transformers>=4.40",
  "datasets>=2.19",
  "huggingface-hub>=0.23",
]

# Backwards-compatible all-in-one profile. Keep this list explicit so existing
# xscientist[full] installations resolve exactly the same direct dependencies.
full = [
  "anthropic>=0.25",
  "backoff>=2.0",
  "black>=24.0",
  "openai>=1.40",
  "zhipuai>=2.0",
  "matplotlib>=3.8",
  "pillow>=10",
  "pandas>=2",
  "pypdf>=4",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.20",
  "seaborn>=0.13",
  "numpy>=1.26",
  "psutil>=5.9",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "transformers>=4.40",
  "datasets>=2.19",
  "tiktoken>=0.7",
  "tqdm>=4.66",
  "rich>=13",
  "humanize>=4",
  "dataclasses-json>=0.6",
  "genson>=1.2",
  "shutup>=0.2",
  "python-igraph>=0.11",
  "coolname>=2",
  "omegaconf>=2.3",
  "boto3>=1.34",
  "huggingface-hub>=0.23",
]
service = [
  "fastapi>=0.115",
  "pydantic>=2.5",
  "uvicorn[standard]>=0.30",
]
trust = [
  "cryptography>=42",
]
dev = [
  "black>=24.0",
  "build>=1.2",
  "coverage[toml]>=7.6",
  "httpx>=0.27",
  "pytest>=8.0",
  "twine>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/smileformylove/XScientist"
Repository = "https://github.com/smileformylove/XScientist"
Issues = "https://github.com/smileformylove/XScientist/issues"
Changelog = "https://github.com/smileformylove/XScientist/blob/main/CHANGELOG.md"
Documentation = "https://github.com/smileformylove/XScientist/tree/main/docs"

[project.scripts]
xscientist = "xscientist.cli:main"
xscientist-api = "xscientist.service:main"
xscientist-project = "xscientist.entrypoints:project_main"
xscientist-batch = "xscientist.entrypoints:batch_main"
xscientist-daemon = "xscientist.entrypoints:daemon_main"
xscientist-ara = "xscientist.entrypoints:ara_main"
xscientist-manager = "xscientist.entrypoints:manager_main"
xscientist-auth = "xscientist.entrypoints:auth_main"
xscientist-feedback = "xscientist.entrypoints:feedback_main"
xscientist-validate = "xscientist.entrypoints:validate_main"
xscientist-bfts = "xscientist.entrypoints:bfts_main"
xscientist-zhipu = "xscientist.entrypoints:zhipu_main"
xscientist-preflight = "xscientist.entrypoints:preflight_main"
xscientist-research = "xscientist.entrypoints:research_main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "auth_cli",
  "continuous_paper_generator",
  "continuous_research_daemon",
  "feedback_cli",
  "launch_scientist_bfts",
  "launch_scientist_zhipu",
  "preflight_check",
  "research_manager",
  "run_ara_fork",
  "run_project",
  "validate_repo",
]

[tool.setuptools.package-dir]
"" = "compat"
ai_scientist = "ai_scientist"
xscientist = "xscientist"

[tool.setuptools.packages.find]
where = ["compat", "."]
include = ["ai_scientist*", "xscientist*"]

[tool.setuptools.package-data]
ai_scientist = [
  "blank_icbinb_latex/*",
  "blank_icml_latex/*",
  "fewshot_examples/*.json",
  "fewshot_examples/*.txt",
  "ideas/*.json",
  "ideas/*.md",
  "protocol/SPEC.md",
  "protocol/conformance/*",
  "protocol/schemas/*.json",
  "resources/configs/*.yaml",
  "treesearch/utils/viz_templates/*.html",
  "treesearch/utils/viz_templates/*.js",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
ai_scientist = ["fewshot_examples/*.pdf"]

[tool.setuptools.dynamic]
version = { attr = "xscientist._version.__version__" }

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"
extend-exclude = '''
(
  /(
      \.git
    | \.venv
    | \.ci-output
    | _outputs
    | final_papers
    | experiments
  )/
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Keep source-checkout test runs deterministic.  Without an explicit project
# path, the standalone ``pytest`` console script can omit the repository root
# from ``sys.path`` (and an unrelated site-packages ``tests`` namespace can
# win import resolution), making collection fail before any test runs.
pythonpath = ["."]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ai_scientist", "xscientist", "compat", "scripts", "tools"]
omit = [
  "*/__pycache__/*",
  "*/site-packages/*",
]

[tool.coverage.report]
fail_under = 45
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = ".ci-output/coverage.xml"

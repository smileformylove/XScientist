name: Bug report
description: Report a reproducible software or packaging defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private data, or unpublished artifacts.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the exact command and the smallest safe input.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XScientist version or commit
      placeholder: 0.1.1 or d91f761
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, install method, backend, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, local identities, and sensitive research data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal information, and restricted data.
          required: true

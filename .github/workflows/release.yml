name: Publish Python Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-ci.txt

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Validate tagged release metadata
        if: github.ref_type == 'tag'
        run: python tools/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Run engineering checks
        run: python tools/engineering_checks.py

      - name: Build distributions
        run: python tools/build_distribution.py --outdir dist

      - name: Inspect and smoke-install distributions
        run: |
          python -m twine check dist/*
          python tools/check_distribution.py --dist-dir dist

      - name: Write artifact checksums
        run: |
          mkdir -p checksums
          python - <<'PY'
          import hashlib
          from pathlib import Path

          lines = []
          for path in sorted(Path("dist").iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          Path("checksums/SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY

      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/
            checksums/
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xscientist
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/dist/

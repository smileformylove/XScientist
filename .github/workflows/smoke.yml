name: Smoke Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/.ci-output/ai-scientist-output
      AI_SCIENTIST_AUTH_FILE: ${{ github.workspace }}/.ci-output/auth/session.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-smoke.txt
            constraints-ci.txt
            pyproject.toml

      - name: Prepare CI logs
        run: mkdir -p .ci-output/logs

      - name: Install smoke dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip setuptools wheel 2>&1 | tee .ci-output/logs/pip-bootstrap.log
          python -m pip install build 2>&1 | tee .ci-output/logs/pip-build-install.log
          python -m pip install --retries 5 --timeout 60 -r requirements-smoke.txt -c constraints-ci.txt 2>&1 | tee .ci-output/logs/pip-install.log

      - name: Seed login session for CI
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          auth_file = Path(os.environ["AI_SCIENTIST_AUTH_FILE"]).resolve()
          auth_file.parent.mkdir(parents=True, exist_ok=True)
          issued_at = datetime.now(timezone.utc)
          payload = {
              "username": "ci-bot",
              "session_id": "ci-seeded-session",
              "issued_at": issued_at.isoformat(),
              "expires_at": (issued_at + timedelta(hours=24)).isoformat(),
              "last_seen_at": issued_at.isoformat(),
              "extra": {"source": "github-actions"},
          }
          auth_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"seeded auth session at: {auth_file}")
          PY

      - name: Run syntax checks
        run: |
          set -o pipefail
          python -m compileall -q ai_scientist xscientist *.py tests 2>&1 | tee .ci-output/logs/syntax.log
          bash -n run_stable_daemon.sh 2>&1 | tee .ci-output/logs/run_stable_daemon_syntax.log
          bash -n start_research.sh 2>&1 | tee .ci-output/logs/start_research_syntax.log

      - name: Run open-source hygiene tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee .ci-output/logs/unittest.log

      - name: ARA protocol conformance smoke
        # O5: assert the exporter still produces a strict-mode-valid ARA, and
        # that the stub A/B still short-circuits the LLM draft. Any regression
        # here means either the on-disk schema drifted or the seed short-
        # circuit stopped working — both are protocol-level failures worth
        # blocking on.
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee .ci-output/logs/ara_protocol_smoke.log
          import json, os, subprocess, sys, tempfile
          from pathlib import Path

          from ai_scientist.utils.ara_artifact import export_ara
          from ai_scientist.utils.ara_seed import (
              build_seed_manifest_from_ara_node,
              stage_seed_manifest,
          )

          tmp = Path(tempfile.mkdtemp())
          exp = tmp / "parent" / "02_experiments" / "20260101_idea"
          (exp / "logs" / "0-run").mkdir(parents=True)
          (exp / "logs" / "0-run" / "journal.json").write_text(json.dumps({
              "nodes": [{
                  "id": "n1", "step": 0, "code": "print('smoke')",
                  "_term_out": ["ok\n"],
                  "metric": {"value": 0.5, "maximize": True, "name": "acc",
                              "description": ""},
                  "is_buggy": False, "parent_id": None, "children": [],
              }],
              "node2parent": {}, "__version": "2",
          }))
          ara = export_ara(project_dir=tmp / "parent", exp_dir=exp,
                          idea={"Name": "smoke"}, timestamp="20260101")
          seed_manifest = build_seed_manifest_from_ara_node(
              ara_root=ara.root, node_id="n1"
          )
          seed_path = stage_seed_manifest(seed_manifest, workspace_dir=tmp / "ws")
          result = subprocess.run([
              sys.executable, "-m", "ai_scientist.experiments.ara_ab.harness",
              "stub",
              "--seed-manifest", str(seed_path),
              "--out-dir", str(tmp / "out"),
              "--check-ara", str(ara.root),
          ], check=True, capture_output=True, text=True)
          print(result.stdout)
          PY

      - name: Run repository validator
        run: |
          set -o pipefail
          python validate_repo.py --full-import-smoke 2>&1 | tee .ci-output/logs/validate_repo.log

      - name: Build distribution artifacts
        run: |
          set -o pipefail
          python -m build --sdist --wheel 2>&1 | tee .ci-output/logs/package-build.log

      - name: Run preflight
        run: |
          set -o pipefail
          python preflight_check.py --strict 2>&1 | tee .ci-output/logs/preflight.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-checks-artifacts
          path: .ci-output/
          include-hidden-files: true
          retention-days: 7

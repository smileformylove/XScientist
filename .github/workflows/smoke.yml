name: Smoke Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: python tools/privacy_exec.py -- python -m pip install --upgrade pip setuptools wheel

      - name: Install core package
        run: python tools/privacy_exec.py -- python -m pip install -e . -c requirements/constraints-ci.txt

      - name: Check core dependencies
        run: python tools/privacy_exec.py -- python -m pip check

      - name: Exercise protocol
        run: python tools/privacy_exec.py -- python -m unittest discover -s tests -p "test_protocol.py"

      - name: Exercise platform path defaults
        run: python tools/privacy_exec.py -- python -m unittest discover -s tests -p "test_config_paths_defaults.py"

      - name: Exercise canonical atomic writes
        run: python tools/privacy_exec.py -- python -m unittest discover -s tests -p "test_atomic_io.py"

      - name: Exercise bounded Git capture
        run: python tools/privacy_exec.py -- python -m unittest discover -s tests -p "test_bounded_git.py"

      - name: Import the core SDK
        run: python -c "import xscientist; from xscientist import ProjectRequest, XScientist; assert xscientist.__version__ and ProjectRequest and XScientist"

      - name: Exercise core CLI metadata
        run: python -m xscientist info --json

      - name: Install the build frontend
        run: python tools/privacy_exec.py -- python -m pip install build -c requirements/constraints-ci.txt

      - name: Build distribution artifacts
        run: python tools/privacy_exec.py -- python tools/build_distribution.py --outdir .ci-dist --no-isolation

      - name: Exercise the built-wheel offline first journey
        run: python tools/privacy_exec.py -- python tools/check_distribution.py --dist-dir .ci-dist --no-install-deps

      - name: Exercise extended SDK behavior
        if: runner.os != 'Windows'
        run: python tools/privacy_exec.py -- python -m unittest discover -s tests -p "test_public_sdk.py"

  full-smoke:
    name: Full engineering and artifact checks
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/.ci-output/ai-scientist-output
      AI_SCIENTIST_AUTH_FILE: ${{ github.workspace }}/.ci-output/auth/session.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/smoke.txt
            requirements/constraints-ci.txt
            pyproject.toml

      - name: Prepare CI logs
        run: mkdir -p .ci-output/logs

      - name: Install smoke dependencies
        run: |
          set -o pipefail
          python tools/privacy_exec.py -- python -m pip install --upgrade pip setuptools wheel 2>&1 | tee .ci-output/logs/pip-bootstrap.log
          python tools/privacy_exec.py -- python -m pip install build 2>&1 | tee .ci-output/logs/pip-build-install.log
          python tools/privacy_exec.py -- python -m pip install --retries 5 --timeout 60 -r requirements/smoke.txt -c requirements/constraints-ci.txt 2>&1 | tee .ci-output/logs/pip-install.log
          python tools/privacy_exec.py -- python -m pip check 2>&1 | tee .ci-output/logs/pip-check.log

      - name: Run engineering consistency checks
        run: |
          set -o pipefail
          python tools/engineering_checks.py 2>&1 | tee .ci-output/logs/engineering.log

      - name: Seed login session for CI
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          auth_file = Path(os.environ["AI_SCIENTIST_AUTH_FILE"]).resolve()
          auth_file.parent.mkdir(parents=True, exist_ok=True)
          issued_at = datetime.now(timezone.utc)
          payload = {
              "username": "ci-bot",
              "session_id": "ci-seeded-session",
              "issued_at": issued_at.isoformat(),
              "expires_at": (issued_at + timedelta(hours=24)).isoformat(),
              "last_seen_at": issued_at.isoformat(),
              "extra": {"source": "github-actions"},
          }
          auth_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("seeded isolated auth session")
          PY

      - name: Run syntax checks
        run: |
          set -o pipefail
          make PYTHON=python syntax 2>&1 | tee .ci-output/logs/syntax.log

      - name: Run tests with coverage regression gate
        run: |
          set -o pipefail
          python -m coverage erase
          python tools/privacy_exec.py -- python -m coverage run -m unittest discover -v -s tests -p "test_*.py" 2>&1 | tee .ci-output/logs/unittest.log
          python -m coverage xml
          python -m coverage report 2>&1 | tee .ci-output/logs/coverage.log

      - name: ARA protocol conformance smoke
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee .ci-output/logs/ara_protocol_smoke.log
          import json, subprocess, sys, tempfile
          from pathlib import Path

          from ai_scientist.utils.ara_artifact import export_ara
          from ai_scientist.utils.ara_seed import (
              build_seed_manifest_from_ara_node,
              stage_seed_manifest,
          )
          from ai_scientist.utils.privacy import redact_sensitive_text

          tmp = Path(tempfile.mkdtemp())
          exp = tmp / "parent" / "02_experiments" / "20260101_idea"
          (exp / "logs" / "0-run").mkdir(parents=True)
          (exp / "logs" / "0-run" / "journal.json").write_text(json.dumps({
              "nodes": [{
                  "id": "n1", "step": 0, "code": "print('smoke')",
                  "_term_out": ["ok\n"],
                  "metric": {"value": 0.5, "maximize": True, "name": "acc",
                              "description": ""},
                  "is_buggy": False, "parent_id": None, "children": [],
              }],
              "node2parent": {}, "__version": "2",
          }))
          ara = export_ara(project_dir=tmp / "parent", exp_dir=exp,
                           idea={"Name": "smoke"}, timestamp="20260101")
          seed_manifest = build_seed_manifest_from_ara_node(
              ara_root=ara.root, node_id="n1"
          )
          seed_path = stage_seed_manifest(seed_manifest, workspace_dir=tmp / "ws")
          result = subprocess.run([
              sys.executable, "-m", "ai_scientist.experiments.ara_ab.harness",
              "stub",
              "--seed-manifest", str(seed_path),
              "--out-dir", str(tmp / "out"),
              "--check-ara", str(ara.root),
          ], check=True, capture_output=True, text=True)
          print(redact_sensitive_text(result.stdout))
          PY

      - name: Run repository validator
        run: |
          set -o pipefail
          python tools/privacy_exec.py -- python -m xscientist validate --full-import-smoke 2>&1 | tee .ci-output/logs/validate_repo.log

      - name: Build and inspect distribution artifacts
        run: |
          set -o pipefail
          python tools/privacy_exec.py -- python tools/build_distribution.py --outdir .ci-output/dist 2>&1 | tee .ci-output/logs/package-build.log
          python tools/privacy_exec.py -- python tools/check_distribution.py --dist-dir .ci-output/dist 2>&1 | tee .ci-output/logs/package-check.log

      - name: Run preflight
        run: |
          set -o pipefail
          python tools/privacy_exec.py -- python -m xscientist preflight --strict 2>&1 | tee .ci-output/logs/preflight.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-checks-artifacts
          path: .ci-output/
          include-hidden-files: true
          retention-days: 7
